name: uniride_app
description: "UniRide Live University Bus Tracking System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.6
  firebase_messaging: ^15.2.5

  # Google Sign In
  google_sign_in: ^6.3.0

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2

  # Maps & Geolocation
  google_maps_flutter: ^2.14.0
  geolocator: ^13.0.2

  # Background Location Streaming
  flutter_foreground_task: ^8.1.0

  # QR Scanning & Generation
  mobile_scanner: ^6.0.4
  qr_flutter: ^4.1.0

  # Notifications & Feedback
  flutter_local_notifications: ^18.0.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
