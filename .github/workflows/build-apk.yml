name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter (with specific version)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.2'
        channel: 'stable'
        cache: true

    - name: Print Flutter and Dart versions
      run: |
        echo "=== Flutter Version ==="
        flutter --version
        echo ""
        echo "=== Dart Version ==="
        dart --version

    - name: Install dependencies
      run: flutter pub get

    - name: Configure Gradle for Android build
      run: |
        echo "kotlin.incremental=false" >> android/gradle.properties
        echo "kotlin.incremental.multiplatform=false" >> android/gradle.properties
        echo "org.gradle.parallel=true" >> android/gradle.properties
        echo "org.gradle.workers.max=4" >> android/gradle.properties
        echo "org.gradle.daemon=true" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m" >> android/gradle.properties

    - name: Clean build
      run: flutter clean

    - name: Build Debug APK
      run: flutter build apk --debug

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      if: hashFiles('build/app/outputs/flutter-apk/app-debug.apk') != ''
      with:
        name: debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 30

    - name: Build Summary
      if: always()
      run: |
        echo "=== Build Summary ==="
        if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
          echo "✅ Debug APK built successfully!"
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
        else
          echo "❌ Debug APK not found"
        fi
