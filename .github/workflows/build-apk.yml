name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Java 11
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'stable'
        cache: true

    - name: Print Flutter and Dart versions
      run: |
        flutter --version
        dart --version

    - name: Install dependencies
      run: flutter pub get

    - name: Configure Gradle for Android build
      run: |
        echo "kotlin.incremental=false" >> android/gradle.properties
        echo "kotlin.incremental.multiplatform=false" >> android/gradle.properties
        echo "org.gradle.parallel=true" >> android/gradle.properties
        echo "org.gradle.workers.max=4" >> android/gradle.properties
        echo "org.gradle.daemon=true" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m" >> android/gradle.properties
        cat android/gradle.properties

    - name: Clean build
      run: flutter clean

    - name: Build Debug APK - Verbose with full output
      run: flutter build apk --debug --verbose 2>&1 | tee build-output.log
      continue-on-error: true

    - name: Display full build log on failure
      if: failure()
      run: |
        echo "=== FULL BUILD LOG ==="
        cat build-output.log
        echo ""
        echo "=== Checking for error files ==="
        find . -name "*.log" -type f 2>/dev/null | head -20

    - name: List build outputs
      run: |
        echo "=== Checking build outputs ==="
        if [ -d "build/app/outputs/flutter-apk/" ]; then
          ls -lah build/app/outputs/flutter-apk/
        else
          echo "ERROR: No flutter-apk directory found"
          find build -name "*.apk" 2>/dev/null || echo "No APK files found anywhere"
        fi

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      if: hashFiles('build/app/outputs/flutter-apk/app-debug.apk') != ''
      with:
        name: debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 30
