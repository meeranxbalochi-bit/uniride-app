name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'stable'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze
      run: flutter analyze

    - name: Build APK (Debug)
      run: flutter build apk --debug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: build/app/outputs/flutter-apk/app-debug.apk

    - name: Configure Gradle for Release Build
      run: |
        echo "kotlin.incremental=false" >> android/gradle.properties
        echo "kotlin.incremental.multiplatform=false" >> android/gradle.properties
        echo "org.gradle.parallel=true" >> android/gradle.properties
        echo "org.gradle.workers.max=4" >> android/gradle.properties

    - name: Build APK (Release)
      run: flutter build apk --release
      continue-on-error: true

    - name: Upload Release APK
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
