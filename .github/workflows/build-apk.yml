name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Java 11
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Configure Gradle for Android build
      run: |
        echo "kotlin.incremental=false" >> android/gradle.properties
        echo "kotlin.incremental.multiplatform=false" >> android/gradle.properties
        echo "org.gradle.parallel=true" >> android/gradle.properties
        echo "org.gradle.workers.max=4" >> android/gradle.properties
        echo "org.gradle.daemon=true" >> android/gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m" >> android/gradle.properties

    - name: Build Debug APK with verbose output
      run: flutter build apk --debug --verbose

    - name: List build outputs
      run: |
        echo "=== Checking build outputs ==="
        if [ -d "build/app/outputs/flutter-apk/" ]; then
          ls -lah build/app/outputs/flutter-apk/
        else
          echo "No flutter-apk directory found"
        fi
        
        echo "=== Checking build directory ==="
        ls -lah build/app/outputs/ 2>/dev/null || echo "No outputs directory"

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      if: hashFiles('build/app/outputs/flutter-apk/app-debug.apk') != ''
      with:
        name: debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 30
